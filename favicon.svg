<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b2a59"/>
      <stop offset="70%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <radialGradient id="catFur" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="60%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#f57c00"/>
    </radialGradient>
    <radialGradient id="catEye" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="40%" stop-color="#26a69a"/>
      <stop offset="100%" stop-color="#004d40"/>
    </radialGradient>
  </defs>

  <!-- Background Circle with Golden Rim -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#f5c542" stroke-width="2"/>

  <!-- Cat Ears -->
  <polygon points="17,25 12,12 26,19" fill="url(#catFur)"/>
  <polygon points="17,23 14,14 24,19" fill="#ff80ab"/>

  <polygon points="47,25 52,12 38,19" fill="url(#catFur)"/>
  <polygon points="47,23 50,14 40,19" fill="#ff80ab"/>

  <!-- Cat Head Peeking -->
  <ellipse cx="32" cy="34" rx="18" ry="15" fill="url(#catFur)"/>

  <!-- Cheeks / Muzzle -->
  <ellipse cx="28" cy="38" rx="5" ry="3.5" fill="#ffffff"/>
  <ellipse cx="36" cy="38" rx="5" ry="3.5" fill="#ffffff"/>

  <!-- Blushing Cheeks -->
  <circle cx="21" cy="37" r="3.5" fill="#ff4081" opacity="0.65"/>
  <circle cx="43" cy="37" r="3.5" fill="#ff4081" opacity="0.65"/>

  <!-- Sparkling Jade Eyes -->
  <ellipse cx="25" cy="31" rx="4" ry="4.5" fill="#ffffff"/>
  <ellipse cx="39" cy="31" rx="4" ry="4.5" fill="#ffffff"/>
  <ellipse cx="25" cy="31" rx="3.2" ry="3.8" fill="url(#catEye)"/>
  <ellipse cx="39" cy="31" rx="3.2" ry="3.8" fill="url(#catEye)"/>
  <ellipse cx="25" cy="31" rx="2" ry="2.6" fill="#0d1b18"/>
  <ellipse cx="39" cy="31" rx="2" ry="2.6" fill="#0d1b18"/>
  <circle cx="23.8" cy="29.5" r="1.1" fill="#ffffff"/>
  <circle cx="37.8" cy="29.5" r="1.1" fill="#ffffff"/>

  <!-- Tiny Pink Nose & Mouth -->
  <polygon points="31,36 33,36 32,37.5" fill="#ff4081"/>
  <path d="M 30 38 Q 32 40 32 38.5 Q 32 40 34 38" stroke="#26170d" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- Paws Peeking Over Ledge -->
  <!-- Left Paw -->
  <ellipse cx="21" cy="46" rx="5" ry="4" fill="url(#catFur)"/>
  <ellipse cx="19" cy="45" rx="1.2" ry="1.4" fill="#ff80ab"/>
  <ellipse cx="21" cy="44.2" rx="1.3" ry="1.5" fill="#ff80ab"/>
  <ellipse cx="23" cy="45" rx="1.2" ry="1.4" fill="#ff80ab"/>

  <!-- Right Paw -->
  <ellipse cx="43" cy="46" rx="5" ry="4" fill="url(#catFur)"/>
  <ellipse cx="41" cy="45" rx="1.2" ry="1.4" fill="#ff80ab"/>
  <ellipse cx="43" cy="44.2" rx="1.3" ry="1.5" fill="#ff80ab"/>
  <ellipse cx="45" cy="45" rx="1.2" ry="1.4" fill="#ff80ab"/>

  <!-- Ledge Bar -->
  <path d="M 12 48 Q 32 50 52 48" stroke="#f5c542" stroke-width="2" stroke-linecap="round"/>
</svg>
