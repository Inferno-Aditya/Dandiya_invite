<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Be My Dandiya Partner?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient Night Glow Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <main class="card-container">
    <div class="invite-card" id="invite-card">
      
      <!-- Interactive Animated Cat Stage -->
      <div class="cat-stage" id="cat-stage">
        <svg class="cat-svg" viewBox="0 0 240 240" id="cat-svg" aria-label="Animated Cute Kitten">
          <defs>
            <radialGradient id="catBodyGrad" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#ffb74d"/>
              <stop offset="70%" stop-color="#ffa726"/>
              <stop offset="100%" stop-color="#f57c00"/>
            </radialGradient>
            <radialGradient id="catBellyGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#fff3e0"/>
            </radialGradient>
            <radialGradient id="eyeGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#26a69a"/>
              <stop offset="60%" stop-color="#00695c"/>
              <stop offset="100%" stop-color="#004d40"/>
            </radialGradient>
            <radialGradient id="blushGrad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255, 64, 129, 0.7)"/>
              <stop offset="100%" stop-color="rgba(255, 64, 129, 0)"/>
            </radialGradient>
            <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
          </defs>

          <!-- Animated Tail -->
          <path id="cat-tail" class="cat-tail" d="M 60 190 Q 30 180 25 150 Q 20 120 40 110 Q 55 105 45 130 Q 38 155 70 185 Z" fill="url(#catBodyGrad)"/>

          <!-- Body -->
          <ellipse cx="120" cy="175" rx="58" ry="48" fill="url(#catBodyGrad)"/>
          <ellipse cx="120" cy="182" rx="36" ry="32" fill="url(#catBellyGrad)"/>

          <!-- Left Ear -->
          <g id="ear-left" class="cat-ear ear-left">
            <polygon points="65,95 45,40 100,70" fill="url(#catBodyGrad)"/>
            <polygon points="66,90 52,48 94,72" fill="#ff80ab"/>
          </g>

          <!-- Right Ear -->
          <g id="ear-right" class="cat-ear ear-right">
            <polygon points="175,95 195,40 140,70" fill="url(#catBodyGrad)"/>
            <polygon points="174,90 188,48 146,72" fill="#ff80ab"/>
          </g>

          <!-- Head -->
          <ellipse id="cat-head" cx="120" cy="115" rx="60" ry="52" fill="url(#catBodyGrad)"/>

          <!-- Forehead Stripes -->
          <path d="M 120 70 L 120 84" stroke="#e65100" stroke-width="3" stroke-linecap="round"/>
          <path d="M 110 74 L 113 86" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M 130 74 L 127 86" stroke="#e65100" stroke-width="2.5" stroke-linecap="round"/>

          <!-- Cheeks / Muzzle -->
          <ellipse cx="108" cy="130" rx="15" ry="11" fill="url(#catBellyGrad)"/>
          <ellipse cx="132" cy="130" rx="15" ry="11" fill="url(#catBellyGrad)"/>

          <!-- Blushing Cheeks -->
          <circle id="blush-left" class="cat-blush" cx="82" cy="128" r="14" fill="url(#blushGrad)"/>
          <circle id="blush-right" class="cat-blush" cx="158" cy="128" r="14" fill="url(#blushGrad)"/>

          <!-- Whiskers -->
          <g stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
            <line x1="78" y1="126" x2="42" y2="120"/>
            <line x1="78" y1="131" x2="44" y2="134"/>
            <line x1="162" y1="126" x2="198" y2="120"/>
            <line x1="162" y1="131" x2="196" y2="134"/>
          </g>

          <!-- Eyes Group -->
          <g id="eyes-group" class="eyes-group">
            <!-- Normal Eyes Background -->
            <g id="normal-eyes">
              <!-- Left Eye -->
              <ellipse cx="94" cy="110" rx="14" ry="16" fill="#ffffff"/>
              <!-- Right Eye -->
              <ellipse cx="146" cy="110" rx="14" ry="16" fill="#ffffff"/>

              <!-- Pupils (Controlled by Mouse Tracker) -->
              <g id="pupil-left">
                <ellipse cx="94" cy="110" rx="10" ry="13" fill="url(#eyeGrad)"/>
                <ellipse cx="94" cy="110" rx="6.5" ry="10" fill="#111111"/>
                <circle cx="91" cy="105" r="3.5" fill="#ffffff"/>
                <circle cx="97" cy="114" r="1.8" fill="#ffffff"/>
              </g>

              <g id="pupil-right">
                <ellipse cx="146" cy="110" rx="10" ry="13" fill="url(#eyeGrad)"/>
                <ellipse cx="146" cy="110" rx="6.5" ry="10" fill="#111111"/>
                <circle cx="143" cy="105" r="3.5" fill="#ffffff"/>
                <circle cx="149" cy="114" r="1.8" fill="#ffffff"/>
              </g>

              <!-- Eyelids for Blinking -->
              <path id="eyelid-left" class="eyelid" d="M 80 110 Q 94 94 108 110 Z" fill="#ffa726"/>
              <path id="eyelid-right" class="eyelid" d="M 132 110 Q 146 94 160 110 Z" fill="#ffa726"/>
            </g>

            <!-- Happy Curved Eyes (Shown on YES Hover / Celebration) -->
            <g id="happy-eyes" class="hidden">
              <path d="M 82 112 Q 94 96 106 112" stroke="#2e1c0c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
              <path d="M 134 112 Q 146 96 158 112" stroke="#2e1c0c" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            </g>

            <!-- Sad Teary Eyes (Shown on NO Dodge / Exit Intent) -->
            <g id="sad-eyes" class="hidden">
              <ellipse cx="94" cy="110" rx="14" ry="16" fill="#ffffff"/>
              <ellipse cx="146" cy="110" rx="14" ry="16" fill="#ffffff"/>
              <ellipse cx="94" cy="113" rx="11" ry="13" fill="#111111"/>
              <ellipse cx="146" cy="113" rx="11" ry="13" fill="#111111"/>
              <circle cx="92" cy="108" r="4.5" fill="#ffffff"/>
              <circle cx="96" cy="115" r="2.5" fill="#ffffff"/>
              <circle cx="144" cy="108" r="4.5" fill="#ffffff"/>
              <circle cx="148" cy="115" r="2.5" fill="#ffffff"/>

              <!-- Flowing Animated Tears -->
              <path class="tear tear-left" d="M 94 122 Q 91 138 90 148 Q 94 154 97 148 Z" fill="#4fc3f7" opacity="0.9"/>
              <path class="tear tear-right" d="M 146 122 Q 143 138 142 148 Q 146 154 149 148 Z" fill="#4fc3f7" opacity="0.9"/>
            </g>
          </g>

          <!-- Nose & Mouth -->
          <polygon points="117,126 123,126 120,130" fill="#ff4081"/>
          <path id="cat-mouth" d="M 114 132 Q 120 137 120 131 Q 120 137 126 132" stroke="#2e1c0c" stroke-width="2.5" stroke-linecap="round" fill="none"/>

          <!-- Paws Group (Moving Paws) -->
          <g id="paws-group">
            <!-- Left Paw -->
            <g id="paw-left" class="cat-paw paw-left">
              <ellipse cx="88" cy="125" rx="20" ry="18" fill="url(#catBodyGrad)"/>
              <!-- Paw Toe Beans / Fingers -->
              <ellipse cx="78" cy="118" rx="5" ry="6" fill="#ff80ab"/>
              <ellipse cx="88" cy="114" rx="5.5" ry="6.5" fill="#ff80ab"/>
              <ellipse cx="98" cy="118" rx="5" ry="6" fill="#ff80ab"/>
              <ellipse cx="88" cy="128" rx="7" ry="5.5" fill="#ff80ab"/>
            </g>

            <!-- Right Paw -->
            <g id="paw-right" class="cat-paw paw-right">
              <ellipse cx="152" cy="125" rx="20" ry="18" fill="url(#catBodyGrad)"/>
              <!-- Paw Toe Beans / Fingers -->
              <ellipse cx="142" cy="118" rx="5" ry="6" fill="#ff80ab"/>
              <ellipse cx="152" cy="114" rx="5.5" ry="6.5" fill="#ff80ab"/>
              <ellipse cx="162" cy="118" rx="5" ry="6" fill="#ff80ab"/>
              <ellipse cx="152" cy="128" rx="7" ry="5.5" fill="#ff80ab"/>
            </g>
          </g>

        </svg>
      </div>

      <!-- Minimalist Dynamic Emotion Word -->
      <div class="emotion-word-wrapper">
        <span id="emotion-word" class="emotion-word">Please?</span>
      </div>

      <!-- The Big Question -->
      <h1 class="main-title">
        Will you be my <span class="highlight-dandiya">Dandiya Partner</span>?
      </h1>

      <!-- Buttons Arena -->
      <div class="button-arena" id="button-arena">
        <button id="btn-yes" class="btn btn-yes">
          <span>Yes</span>
        </button>

        <button id="btn-no" class="btn btn-no">
          <span>No</span>
        </button>
      </div>

      <!-- Simple Success Screen (Revealed on YES) -->
      <div class="celebration-container" id="celebration-container" style="display: none;">
        <h2 class="celebration-heading">Yay!</h2>
        <p class="celebration-text">Can't wait to dance with you!</p>
        
        <a id="whatsapp-link" href="#" target="_blank" class="btn btn-reply">
          <span>Send Reply</span>
        </a>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
